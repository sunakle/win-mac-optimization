http_port 3128
visible_hostname dsh-egress
pid_filename /tmp/squid.pid
cache_log /dev/stderr
access_log none
cache_store_log none
logfile_rotate 0
cache deny all
cache_mem 16 MB
maximum_object_size 0 KB
shutdown_lifetime 2 seconds
pinger_enable off
acl safe_ports port 80 443
acl tls_ports port 443
acl connect_method method CONNECT
acl allowed_domains dstdomain -n "/etc/squid/allowed-domains.txt"
http_access deny manager
http_access deny !safe_ports
http_access deny connect_method !tls_ports
http_access allow allowed_domains
http_access deny all
cache_peer http.docker.internal parent 3128 0 no-query default
never_direct allow all
forwarded_for delete
via off

